<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sudoku</title>

    <link rel="stylesheet" href="https://pyscript.net/releases/2026.3.1/core.css" />
    <script type="module" src="https://pyscript.net/releases/2026.3.1/core.js"></script>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <center>
        <header>
            <h1>Sudoku</h1>
            <h4>Hecho por José</h4>
            <div id="seleccionar">
                <p>Seleccione la dificultad:</p>
                <select id="dificultad">
                    <option selected="true" disabled>Dificultad:</option>
                    <option value="facil">Fácil</option>
                    <option value="medio">Medio</option>
                    <option value="dificil">Difícil</option>
                </select>
            </div>
        </header>
        
        <div id="sudoku-board" class="oculto"></div>

        <div id="selector-numeros" class="oculto">
            <span class="num-btn" data-num="1">1</span>
            <span class="num-btn" data-num="2">2</span>
            <span class="num-btn" data-num="3">3</span>
            <span class="num-btn" data-num="4">4</span>
            <span class="num-btn" data-num="5">5</span>
            <span class="num-btn" data-num="6">6</span>
            <span class="num-btn" data-num="7">7</span>
            <span class="num-btn" data-num="8">8</span>
            <span class="num-btn" data-num="9">9</span>
            <span class="num-btn" data-num="X">X</span>
        </div>
        <div id="contador-restantes" class="oculto"></div>

        <button id="btn-comprobar" class="oculto">Comprobar</button>
        <button id="btn-pista" class="oculto">Pista</button>

        <footer>
            <a href="../index.html">Volver al Menú Principal</a>
        </footer>
    </center>

    <script type="py" src="./main.py" config="./pyscript.json"></script>
</body>

</html>
